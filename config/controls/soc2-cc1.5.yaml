control:
  id: soc2-cc1.5
  title: Current employees have acknowledged the acceptable use policy
  statement: >
    Every current employee has a signed acknowledgment of the acceptable use
    policy on file, signed within the last 365 days. Source is a
    human-maintained form (manual input), not a system export.
  owner: people-ops@example.invalid
  frequency: 30d
  mappings:
    soc2: [CC1.5]
    iso_27001_2022: [A.5.10]

source: hr_acknowledgments

checks:
  - description: Every current employee signed the AUP within the last 365 days
    population:
      path: employees
      where:
        status: current
    must:
      path: signed_at
      op: date_within_days
      value: 365

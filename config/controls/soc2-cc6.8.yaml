control:
  id: soc2-cc6.8
  title: Secret scanning enabled on all repositories
  statement: >
    All repositories in the organization have secret scanning enabled so that
    accidentally committed credentials are detected, with push protection
    where available.
  owner: platform-team@example.invalid
  frequency: 1d
  mappings:
    soc2: [CC6.8]
    iso_27001_2022: [A.8.28]

source: github_org

checks:
  - description: Secret scanning is enabled in every repository
    population:
      path: repos
    must:
      path: secret_scanning.enabled
      op: all_equal
      value: true

  - description: Push protection is enabled in every repository
    population:
      path: repos
    must:
      path: secret_scanning.push_protection
      op: all_equal
      value: true

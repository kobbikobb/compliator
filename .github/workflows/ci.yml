name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: engine (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The low end is the version ENGINE.md claims support for: testing it is
        # what keeps "Python 3.9+" an assertion instead of a hope.
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the one runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: make test
      - name: Banned vocabulary (scripts/slop-words.txt)
        run: make check-words
      - name: End-to-end smoke (collect, then verify every record)
        run: make demo
